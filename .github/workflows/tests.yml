name: CPU core checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 opencv-python-headless==4.11.0.86 fastapi==0.115.12 httpx==0.28.1 pytest==8.3.5
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/diagnostics.test.mjs
